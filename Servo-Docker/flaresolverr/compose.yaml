services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    ports:
      - "8191:8191"
    environment:
      LOG_LEVEL: info
      # Browser goes through gluetun (Surfshark), same exit IP as Prowlarr's indexer proxy
      PROXY_URL: http://192.168.11.3:8889
      TZ: Asia/Kolkata
