version: '3.8'
services:
  elasticsearch:
    container_name: elk-elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.4
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - xpack.security.http.ssl.enabled=false
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 4G
    volumes:
      - /mnt/user/appdata/elastic-stack/data/elasticsearch:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  kibana:
    container_name: elk-kibana
    image: docker.elastic.co/kibana/kibana:9.2.4
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - xpack.security.enabled=false
      - xpack.encryptedSavedObjects.encryptionKey=abcdefgh1234567890abcdef12345678
      - xpack.reporting.encryptionKey=12345678abcdefgh1234567890abcdef
      - TI_TELEMETRY_OPTIN=false
    ports:
      - "5601:5601"
    volumes:
      - /mnt/user/appdata/elastic-stack/data/kibana:/usr/share/kibana/data
    depends_on:
      elasticsearch:
        condition: service_healthy

  connectors:
    image: docker.elastic.co/integrations/elastic-connectors:9.2.4
    container_name: elk-connector
    volumes:
      # Map the config file you just created into the container
      - /mnt/user/appdata/elastic-stack/config/connectors/config.yml:/config/config.yml
    # We override the command to point specifically to your mounted config
    command: /app/bin/elastic-ingest -c /config/config.yml
    depends_on:
      elasticsearch:
        condition: service_healthy


