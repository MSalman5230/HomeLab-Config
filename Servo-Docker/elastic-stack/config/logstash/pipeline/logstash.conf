# Logstash pipeline config: input → filter (optional) → output
# Copy this file to: /mnt/user/appdata/elastic-stack/config/logstash/pipeline/

input {
  beats {
    port => 5044
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "logstash-%{+YYYY.MM.dd}"
  }
}
