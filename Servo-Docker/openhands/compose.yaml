services:
  openhands:
    image: ghcr.io/openhands/agent-canvas:latest
    container_name: openhands
    restart: unless-stopped
    ports:
      - "8010:8000" # Canvas UI + API (8000 is taken by Portainer)
    environment:
      # Session key for the API. Unset: generated once and persisted in the data folder.
      LOCAL_BACKEND_API_KEY: ${LOCAL_BACKEND_API_KEY:-}
      TZ: Asia/Kolkata
    volumes:
      # Both owned by uid 10001 (openhands); see README
      - /mnt/user/appdata/openhands/data:/home/openhands/.openhands
      - /mnt/user/appdata/openhands/projects:/projects
