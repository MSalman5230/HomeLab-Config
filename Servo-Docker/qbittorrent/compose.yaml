services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    ports:
      - "8080:8080" # Web UI
    environment:
      PUID: 99
      PGID: 100
      TZ: Asia/Kolkata
      WEBUI_PORT: 8080
    volumes:
      - /mnt/user/appdata/qbittorrent:/config
      - /mnt/user/downloads:/downloads
