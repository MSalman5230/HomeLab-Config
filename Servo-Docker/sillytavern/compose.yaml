services:
  sillytavern:
    image: ghcr.io/sillytavern/sillytavern:${SILLYTAVERN_VERSION:-latest}
    container_name: sillytavern
    restart: unless-stopped
    ports:
      - "${PUBLIC_PORT:-8006}:8000"
    environment:
      SILLYTAVERN_HEARTBEATINTERVAL: ${SILLYTAVERN_HEARTBEATINTERVAL:-30}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - /mnt/user/appdata/sillytavern/config:/home/node/app/config
      - /mnt/user/appdata/sillytavern/data:/home/node/app/data
      - /mnt/user/appdata/sillytavern/plugins:/home/node/app/plugins
      - /mnt/user/appdata/sillytavern/extensions:/home/node/app/public/scripts/extensions/third-party
    healthcheck:
      test: ["CMD", "node", "src/healthcheck.js"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
