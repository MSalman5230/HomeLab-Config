services:
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    environment:
      TZ: Asia/Kolkata
      APP_URL: ${APP_URL:-http://192.168.11.3:8090}
    ports:
      - "8090:8090"
    volumes:
      - /mnt/user/appdata/beszel/data:/beszel_data
      - /mnt/user/appdata/beszel/socket:/beszel_socket

  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: Asia/Kolkata
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: http://localhost:8090
      # Set these from the new hub's Add System dialog, then recreate the agent.
      KEY: ${KEY:-}
      TOKEN: ${TOKEN:-}
    volumes:
      - /mnt/user/appdata/beszel/agent:/var/lib/beszel-agent
      - /mnt/user/appdata/beszel/socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Preserve the existing Servo disk-monitoring mounts.
      - /mnt/disk1/.beszel:/extra-filesystems/sda1:ro
      - /mnt/disk2/.beszel:/extra-filesystems/sdb1:ro
      - /mnt/disk3/.beszel:/extra-filesystems/sdc1:ro
      - /mnt/disk4/.beszel:/extra-filesystems/sdd1:ro
      - /mnt/disk5/.beszel:/extra-filesystems/sde1:ro
      - /mnt/cache_a/.beszel:/extra-filesystems/cache_a:ro
      - /mnt/cache_b/.beszel:/extra-filesystems/cache_b:ro