services:
  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    hostname: metabase
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - /dev/urandom:/dev/random:ro
      - /mnt/user/appdata/metabase/data:/metabase-data
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      MUID: "99"
      MGID: "100"
      JAVA_TIMEZONE: Asia/Kolkata
    healthcheck:
      test: ["CMD", "curl", "--fail", "-I", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
