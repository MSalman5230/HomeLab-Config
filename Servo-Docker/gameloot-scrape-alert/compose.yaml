services:
  gameloot-scraper:
    image: ghcr.io/msalman5230/gameloot-scrape-alert:latest
    container_name: gameloot-scrape-alert
    restart: unless-stopped
    environment:
      TZ: Asia/Kolkata
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN}
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-%(levelname)s - %(message)s}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
