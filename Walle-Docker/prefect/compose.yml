version: '3.8'
services:
  db:
    image: postgres:14
    restart: always
    environment:
      POSTGRES_USER: prefect
      POSTGRES_PASSWORD: prefectpw
      POSTGRES_DB: prefect
    volumes:
      - db_data:/var/lib/postgresql/data

  prefect-server:
    image: prefecthq/prefect:3-python3.12
    depends_on:
      - db
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: "postgresql+asyncpg://prefect:prefectpw@db:5432/prefect"
      PREFECT_API_DATABASE_ECHO: "false"
      PREFECT_API_DATABASE_MIGRATE_ON_START: "true"
      PREFECT_LOGGING_LEVEL: "INFO"
      PREFECT_LOGGING_HANDLERS_FILE_ENABLED: "false"
      PREFECT_API_URL: "http://192.168.11.2:4200/api"
    command: prefect server start --host 0.0.0.0 --port 4200
    ports:
      - "4200:4200"
    volumes:
      - prefect_data:/data

  prefect-worker:
    image: prefecthq/prefect:3-python3.12
    depends_on:
      - prefect-server
    environment:
      PREFECT_API_URL: "http://prefect-server:4200/api"
      PREFECT_LOGGING_LEVEL: "INFO"

    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    
    command: >
      /bin/sh -c "
        pip install prefect-docker &&
        prefect work-pool create docker-pool --type docker --overwrite || true &&
        prefect worker start --pool docker-pool --with-healthcheck
      "


volumes:
  db_data:
  prefect_data:
