services:
  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: Asia/Kolkata
      LISTEN: "45876"
      HUB_URL: ${HUB_URL:-http://192.168.11.3:8090}
      KEY: ${KEY:?Set KEY from the Servo hub Add System dialog}
      TOKEN: ${TOKEN:?Set TOKEN from the Servo hub Add System dialog}
    volumes:
      - beszel_agent_data:/var/lib/beszel-agent
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  beszel_agent_data:
