version: '3.8'

services:
  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - /docker_data/postgres:/var/lib/postgresql/data
    networks:
      - shared_bridge_1
    user: "1000:1000"

networks:
  shared_bridge_1:
    external: true 